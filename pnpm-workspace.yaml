packages:
  - client
  - fes
  - mock-backend
  - server-common

# One React copy for the client and its tests.
catalog:
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0

saveExact: true

# Supply-chain buffer: a version is installed only once it is a day old (pnpm 11's default).
minimumReleaseAge: 1440
# Our own package, published by us: no need to wait a day for it.
minimumReleaseAgeExclude:
  - '@arun-shop/shell-stub'

allowBuilds:
  esbuild: true
  # Optional New Relic native add-ons (CPU and GC metrics); the agent works without them.
  '@newrelic/fn-inspect': false
  '@newrelic/native-metrics': false
  protobufjs: false
